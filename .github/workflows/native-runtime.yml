name: Rebuild reviewed native runtime sources
on:
  push:
    branches: [main]
    paths:
      - src/native-runtime/**
      - manifests/native-runtime.json
      - .copr/Makefile
      - packaging/at-spi2-core/**
      - packaging/gstreamer1/**
      - packaging/libaccounts-glib/**
      - packaging/libwacom/**
      - packaging/plasma-workspace/**
      - packaging/dolphin/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-runtime-source-requests
  cancel-in-progress: false
jobs:
  request-native-builds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate approved source pins
        run: make validate
      - name: Request all six reviewed native source builds
        env:
          COPR_NATIVE_BUILD_HOOK_BASE: ${{ secrets.COPR_NATIVE_BUILD_HOOK_BASE }}
        run: |
          set -Eeuo pipefail
          test -n "$COPR_NATIVE_BUILD_HOOK_BASE"
          for package in at-spi2-core gstreamer1 libaccounts-glib libwacom plasma-workspace dolphin; do
            curl -fsS --retry 2 -X POST "$COPR_NATIVE_BUILD_HOOK_BASE/$package/" >/dev/null
          done
